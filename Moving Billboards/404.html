<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 &mdash; Page taken down</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5ead8">
<link rel="icon" href="/assets/favicon-v2.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon-v2.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600&display=swap">

<style>
  /* Tokens lifted from the Organic design system so this page stands alone:
     no stylesheet, bundle or script to load, nothing to 404 on its way in. */
  :root {
    --color-bg: #f5ead8;
    --color-surface: #ebddc5;
    --color-text: #201e1d;
    --color-neutral-600: #82796a;
    --color-neutral-700: #645c50;
    --color-accent-500: #d67f48;
    --color-divider: color-mix(in srgb, #201e1d 16%, transparent);
    --font-heading: "Caprasimo", Georgia, serif;
    --font-body: "Figtree", system-ui, sans-serif;
    --radius-lg: 28px;
    --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26.4px;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    width: 100%;
    max-width: 32rem;
    perspective: 1400px;
  }

  /* The two faces sit back to back and the whole card rotates between them.
     The front is in normal flow so it sets the height; the back is pinned
     over it, pre-rotated, and hidden until the card turns. */
  .card {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(0.4, 0.1, 0.2, 1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    padding: 44px 35.2px 48px;
    border-radius: var(--radius-lg);
    background: var(--color-surface);
    box-shadow: var(--shadow-md);
    text-align: center;
    backface-visibility: hidden;
  }

  .face.back {
    position: absolute;
    inset: 0;
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .face.back:focus { outline: none; }

  .code {
    margin: 0;
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: clamp(4rem, 18vw, 6.5rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--color-text);
    display: inline-block;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.18s ease;
  }

  .code:hover { transform: translateY(-2px); }
  .code:active { transform: translateY(0) scale(0.97); }

  .code:focus-visible {
    outline: 2px solid var(--color-accent-500);
    outline-offset: 6px;
    border-radius: var(--radius-lg);
  }

  /* ── Back face ─────────────────────────────────────────────────────── */

  .mark {
    width: 34px;
    height: 34px;
    margin-bottom: 17.6px;
    color: var(--color-accent-500);
  }

  .credit-label {
    margin: 0 0 8.8px;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-neutral-600);
  }

  .credit-name {
    margin: 0 0 17.6px;
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: clamp(1.5rem, 6vw, 2rem);
    line-height: 1.1;
    color: var(--color-text);
  }

  .credit-name a {
    color: inherit;
    text-decoration: none;
    border-bottom: 2px solid var(--color-accent-500);
    padding-bottom: 2px;
  }

  .credit-name a:hover { color: var(--color-accent-500); }

  .credit-line {
    margin: 0;
    max-width: 22rem;
    font-size: 0.9375rem;
    line-height: 1.6;
    color: var(--color-neutral-700);
  }

  .back-hint {
    margin: 26.4px 0 0;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: var(--color-neutral-600);
  }

  .rule {
    width: 56px;
    height: 3px;
    margin: 26.4px auto;
    border: 0;
    border-radius: 999px;
    background: var(--color-accent-500);
  }

  h1 {
    margin: 0 0 13.2px;
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: clamp(1.25rem, 4.5vw, 1.6rem);
    line-height: 1.25;
  }

  p {
    margin: 0;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--color-neutral-700);
  }

  .quiet {
    margin-top: 26.4px;
    padding-top: 17.6px;
    border-top: 1px solid var(--color-divider);
    font-size: 0.8125rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--color-neutral-600);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #201e1d;
      --color-surface: #2e2b25;
      --color-text: #f9f4ed;
      --color-neutral-600: #a19786;
      --color-neutral-700: #c0b6a5;
      --color-divider: color-mix(in srgb, #f9f4ed 18%, transparent);
      --shadow-md: 0 3px 10px rgb(0 0 0 / 45%);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .code { transition: none; }
    .code:hover, .code:active { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="card" id="card">

      <div class="face front" id="front">
        <button type="button" class="code" id="knock" aria-label="404">404</button>
        <hr class="rule">
        <h1>This page has been taken down.</h1>
        <p>It is no longer available at this address.</p>
        <p class="quiet">Moving Billboards</p>
      </div>

      <div class="face back" id="back" tabindex="-1" aria-hidden="true" inert>
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 17l6-6 4 4 8-8" />
        </svg>
        <p class="credit-label">Designed &amp; built by</p>
        <p class="credit-name"><a href="https://github.com/PsyfoCya" rel="noopener">PsyfoCya</a></p>
        <p class="credit-line">Every part of this site &mdash; the layout, the type, the code &mdash; was made by hand. The page is gone. The craft isn&rsquo;t.</p>
        <p class="back-hint">Click anywhere to go back</p>
      </div>

    </div>
  </main>

<script>
  // Easter egg: knock three times on the 404 and the card turns over to the
  // build credit. Knocks lapse after 1.2s so a stray double-click won't do it.
  (function () {
    var card  = document.getElementById('card');
    var front = document.getElementById('front');
    var back  = document.getElementById('back');
    var knock = document.getElementById('knock');
    var knocks = 0, timer = null, flipped = false;

    function show(on) {
      flipped = on;
      // Both faces stay rendered — backface-visibility does the hiding, so the
      // turn animates in both directions. inert + aria-hidden keep whichever
      // face is pointing away out of the a11y tree and out of the tab order.
      face(back, on);
      face(front, !on);
      card.classList.toggle('flipped', on);
      (on ? back : knock).focus({ preventScroll: true });
    }

    function face(el, visible) {
      el.inert = !visible;
      el.setAttribute('aria-hidden', visible ? 'false' : 'true');
    }

    knock.addEventListener('click', function () {
      clearTimeout(timer);
      if (++knocks >= 3) { knocks = 0; show(true); return; }
      timer = setTimeout(function () { knocks = 0; }, 1200);
    });

    back.addEventListener('click', function () { show(false); });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && flipped) show(false);
    });
  })();
</script>
</body>
</html>
